name: Instagram de A Remarla

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_instagram.py
      - .github/workflows/a-remarla-instagram.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Publicaciones a incorporar
        type: choice
        options: [today, latest, previous]
        default: today
  schedule:
    # Una lectura diaria, 09:17 de Argentina.
    - cron: '17 12 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: a-remarla-instagram
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Leer publicaciones públicas e imagen original
        env:
          SYNC_MODE: ${{ github.event_name == 'push' && 'latest' || inputs.mode || 'today' }}
        run: python3 scripts/sync_instagram.py --mode "$SYNC_MODE"
      - name: Guardar las novedades en GitHub
        run: |
          git add a-remarla/data/instagram.json assets/a-remarla-instagram/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Actualizar publicaciones de Instagram de A Remarla'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Actualizar GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  probar_anterior:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[prueba-instagram]')
    needs: importar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Esperar diez minutos desde la primera incorporación
        run: sleep 600
      - uses: actions/checkout@v6
      - name: Leer e incorporar la publicación anterior desde Instagram
        run: python3 scripts/sync_instagram.py --mode previous
      - name: Guardar la segunda incorporación
        run: |
          git add a-remarla/data/instagram.json assets/a-remarla-instagram/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Incorporar la publicación anterior de Instagram de A Remarla'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Actualizar GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
