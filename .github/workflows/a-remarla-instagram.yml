name: Instagram de A Remarla

on:
  push:
    branches: [main, codex/a-remarla-instagram-20261123]
    paths:
      - scripts/sync_instagram.py
      - scripts/sync_instagram_hostinger.php
      - scripts/publish_instagram.sh
      - tests/**
      - assets/a-remarla-vigencia.js
      - assets/a-remarla-campanas.js
      - .github/workflows/a-remarla-instagram.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Publicaciones a incorporar
        type: choice
        options: [new, today, latest, previous]
        default: new
  schedule:
    # Dos lecturas diarias: 09:17 y 21:17 de Argentina.
    - cron: '17 0,12 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: a-remarla-instagram
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verificar el código y el guardado con cambios simultáneos
        run: |
          node --check assets/a-remarla-campanas.js
          node --test tests/test_campaign_expiry.cjs
          python3 -m unittest discover -s tests -v
          php -l scripts/sync_instagram_hostinger.php
      - name: Probar la lectura PHP preparada para Hostinger
        run: php scripts/sync_instagram_hostinger.php --mode=previous --output="$RUNNER_TEMP/ar-instagram-check/feed.json" --image-dir="$RUNNER_TEMP/ar-instagram-check/images"

  importar:
    if: github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Leer y guardar publicaciones desde la versión vigente
        env:
          SYNC_MODE: ${{ inputs.mode || 'new' }}
        run: bash scripts/publish_instagram.sh "$SYNC_MODE"
      - name: Actualizar GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  probar_anterior:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[prueba-instagram]')
    needs: importar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Esperar diez minutos desde la primera incorporación
        run: sleep 600
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Leer y guardar la anterior desde la versión vigente
        run: bash scripts/publish_instagram.sh previous
      - name: Actualizar GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
